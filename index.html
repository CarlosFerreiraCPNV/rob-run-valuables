<style>
/* Layout: sticky filter bar over a dense grid of loot tiles, each tile tinted by its rarity like the in-game slot. */
:root {
  --bg: #f3f1ee; --panel: #ffffff; --slot: #e6e2dc; --fg: #1d1a17; --muted: #6b645c; --line: #d9d3cb;
  --accent: #d9541e;
  --r-legendary: #FFD500; --r-epic: #E375FF; --r-uncommon: #67F835; --r-common: #9A9894;
  --t-legendary: #8a6d00; --t-epic: #9a2fb8; --t-uncommon: #2f7d12; --t-common: #6b6965;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121110; --panel: #1b1918; --slot: #262525; --fg: #eeeae5; --muted: #9a928a; --line: #2e2b29;
  --accent: #ff8a3d;
  --t-legendary: #FFD500; --t-epic: #E375FF; --t-uncommon: #67F835; --t-common: #b5b3ae;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121110; --panel: #1b1918; --slot: #262525; --fg: #eeeae5; --muted: #9a928a; --line: #2e2b29;
  --accent: #ff8a3d;
  --t-legendary: #FFD500; --t-epic: #E375FF; --t-uncommon: #67F835; --t-common: #b5b3ae;
  color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px }
h1 { font-family: var(--display); font-size: clamp(26px, 4vw, 36px); letter-spacing: .02em; margin: 0; text-wrap: balance }
h1 span { color: var(--accent) }
.sub { color: var(--muted); margin: 4px 0 0 }
.sub a { color: inherit }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px; margin-top: 16px; border-bottom: 1px solid var(--line) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 600 13px var(--body); display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 6px 11px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg) }
.chip i { width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--muted)) }
.chip b { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); box-shadow: inset 0 0 0 1px var(--c, var(--accent)) }
.chip:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap }
input, select { font: 14px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px }
input { width: 190px; max-width: 100% }
.count { color: var(--muted); font-size: 13px; margin: 12px 0; font-variant-numeric: tabular-nums }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 }
.item { display: flex; gap: 12px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0 }
.slot { flex: none; width: 64px; height: 64px; border-radius: 3px; display: grid; place-items: center; background: var(--slot);
  background-image: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--c) 66%, transparent)) }
.slot img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 2px 3px #0008) }
.info { min-width: 0; display: flex; flex-direction: column; gap: 2px }
.name { font-weight: 600; color: var(--fg); text-decoration: none; overflow-wrap: anywhere }
.name:hover { text-decoration: underline }
.meta { font-size: 12px; color: var(--muted) }
.meta .rar { color: var(--t); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px }
.price { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums }
.sets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }
.sets span { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--slot); color: var(--muted); font-variant-numeric: tabular-nums }
.empty { color: var(--muted); padding: 40px 0; text-align: center }
.grid.by-set { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start }
.set { padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.set h2 { font: 700 16px var(--display); margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.set h2 small { font: 500 12px var(--body); color: var(--muted) }
.set ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.row { display: flex; align-items: center; gap: 10px; min-width: 0 }
.row .slot { width: 44px; height: 44px }
.row .info { flex: 1 }
.row .qty { font: 700 14px var(--display); color: var(--muted); font-variant-numeric: tabular-nums }
.row.dim { opacity: .35 }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; color: var(--muted); text-align: center }
.totals div { background: var(--slot); border-radius: 3px; padding: 6px 4px }
.totals b { display: block; font: 700 14px var(--display); color: var(--fg); font-variant-numeric: tabular-nums }
.totals .gain b { color: var(--accent) }
@media (max-width: 560px) { .tools { margin-left: 0; width: 100% } input { flex: 1 } }
</style>

    rarity: (a, b) => ORDER.indexOf(a[3]) - ORDER.indexOf(b[3]) || b[5] - a[5],
    "price-desc": (a, b) => b[5] - a[5],
    "price-asc": (a, b) => a[5] - b[5],
    name: (a, b) => a[0].localeCompare(b[0]),
  }[state.sort];
  list = [...list].sort(by);
  grid.innerHTML = list.map(([name, slug, img, r, category, price, sets]) => {
    const [label, key] = RAR[r];
    const setTags = sets.map(([s, n]) => `<span title="${SETS[s][1]} ${fmt(SETS[s][2])}">Set ${s + 1} · ${k(SETS[s][2])}${n > 1 ? " · ×" + n : ""}</span>`).join("");
    return `<li class="item" style="--c:var(--r-${key});--t:var(--t-${key})">
      <span class="slot"><img src="https://static.metaforge.app/rob-run/items/${img}.webp" alt="" loading="lazy"></span>
      <div class="info">
        <a class="name" href="https://metaforge.app/rob-run/database/${slug}" target="_blank" rel="noopener">${name}</a>
        <span class="meta"><span class="rar">${label}</span> · ${category}</span>
        <span class="price">${fmt(price)}</span>
        <div class="sets">${setTags}</div>
      </div></li>`;
  }).join("");
  document.getElementById("count").textContent = `${list.length} objet${list.length > 1 ? "s" : ""} sur ${ITEMS.length}`;
  document.getElementById("empty").hidden = list.length > 0;
}

// A set is shown when one of its items matches the filters; the others stay, dimmed, so the set reads whole.
function renderSets(match, filtering) {
  const shown = SETS.map(([sell, crateName, crate], s) => ({ s, sell, crateName, crate, items: ITEMS.filter(i => i[6].some(([x]) => x === s)) }))
    .filter(set => set.items.some(match));
  grid.innerHTML = shown.map(({ s, sell, crateName, crate, items }) => `<li class="set">
    <h2>Set ${s + 1} <small>${crateName}</small></h2>
    <ul>${items.map(it => {
      const [name, slug, img, r, category, price, sets] = it;
      const [label, key] = RAR[r];
      const n = sets.find(([x]) => x === s)[1];
      return `<li class="row${filtering && !match(it) ? " dim" : ""}" style="--c:var(--r-${key});--t:var(--t-${key})">
        <span class="slot"><img src="https://static.metaforge.app/rob-run/items/${img}.webp" alt="" loading="lazy"></span>
        <div class="info">
          <a class="name" href="https://metaforge.app/rob-run/database/${slug}" target="_blank" rel="noopener">${name}</a>
          <span class="meta"><span class="rar">${label}</span> · ${category} · ${fmt(price)}</span>
        </div>
        <span class="qty">×${n}</span></li>`;
    }).join("")}</ul>
    <div class="totals"><div>Objets vendus<b>${fmt(sell)}</b></div><div>Caisse<b>${fmt(crate)}</b></div><div class="gain">Gain<b>+${fmt(crate - sell)}</b></div></div>
  </li>`).join("");
  document.getElementById("count").textContent = `${shown.length} set${shown.length > 1 ? "s" : ""} sur ${SETS.length}`;
  document.getElementById("empty").hidden = shown.length > 0;
}
render();
</script>
</html>
